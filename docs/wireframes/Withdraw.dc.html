<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원 탈퇴</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E8E4}
a{color:#151515}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 14px; background: #E9E8E4; color: #151515; font-family: 'IBM Plex Sans KR', sans-serif">
<div style="display: flex; align-items: center; height: 44px">
<a href="Profile.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<h1 style="margin: 0; padding: 0 4px; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">탈퇴하기 전에<br>확인해 주세요</h1>
<div style="display: flex; flex-direction: column; padding: 4px 20px; border-radius: 22px; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #EAE9E5; font-size: 15px"><span style="color: #6B6B66">진행 중인 약속</span><span style="font-weight: 600">2개, 바로 끝나요</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid #EAE9E5; font-size: 15px"><span style="color: #6B6B66">결제 예정 금액</span><span style="font-weight: 600">5,000원 먼저 결제</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; font-size: 15px"><span style="color: #6B6B66">기록과 결제 내역</span><span style="font-weight: 600">[보관 기간] 뒤 삭제</span></div>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 16px 18px; border-radius: 16px; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
<div style="font-size: 14px; line-height: 1.5; color: #3F3F3C">결제 예정 금액이 있으면 탈퇴와 함께 등록된 카드로 결제돼요. 이의제기 중인 건은 결과가 나온 뒤 처리돼요.</div>
</div>
<button type="button" onClick="{{ toggle }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; border: none; background: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; color: #151515; text-align: left; cursor: pointer"><sc-if value="{{ on }}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: #151515; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span></sc-if><sc-if value="{{ off }}" hint-placeholder-val="{{ true }}"><span style="flex-shrink: 0; box-sizing: border-box; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9C8C3; background: #FFFFFF"></span></sc-if><span>위 내용을 확인했어요</span></button>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="Profile.dc.html" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 44px; font-size: 15px; font-weight: 600; color: #5E5E59; text-decoration: none">계속 쓸게요</a>
<a href="{{ href }}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: {{ bg }}; color: {{ fg }}; font-size: 17px; font-weight: 600; text-decoration: none">탈퇴하기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: false }; }
  renderVals() {
    const on = this.state.on;
    return { on, off: !on, toggle: () => this.setState({ on: !on }), href: on ? 'Main.dc.html' : '#', bg: on ? '#151515' : '#C9C8C3', fg: on ? '#FFFFFF' : '#6B6B66' };
  }
}
</script>
</body>
</html>
