<div style="font-size: 14px; font-weight: 600; color: #5E5E59">감시자</div>

<div style="display: flex; flex-direction: column; gap: 10px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

  renderVals() { const m = this.state.m; return { missOn: m === 'miss', missOff: m !== 'miss', allOn: m === 'all', allOff: m !== 'all', pick_miss: () => this.setState({ m: 'miss' }), pick_all: () => this.setState({ m: 'all' }) }; }
