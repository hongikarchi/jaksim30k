<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>헬스장 인증 방식</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E8E4}
a{color:#151515}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 14px; background: #E9E8E4; color: #151515; font-family: 'IBM Plex Sans KR', sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Goal.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<h1 style="margin: 0; padding: 0 4px; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">헬스장 인증은<br>어떻게 할까요?</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{ photoOn }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ pick_photo }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; box-sizing: border-box; width: 100%; min-height: 58px; border: 2px solid #151515"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: #151515; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #151515">사진 인증</span><span style="font-size: 12px; color: #6B6B66">헬스장 안에서 그날의 미션과 함께 찍어요</span></span></button></sc-if><sc-if value="{{ photoOff }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ pick_photo }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; box-sizing: border-box; width: 100%; min-height: 58px; border: 1px solid #DAD9D4"><span style="flex-shrink: 0; box-sizing: border-box; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9C8C3; background: #FFFFFF"></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #151515">사진 인증</span><span style="font-size: 12px; color: #6B6B66">헬스장 안에서 그날의 미션과 함께 찍어요</span></span></button></sc-if>
<sc-if value="{{ gpsOn }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ pick_gps }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; box-sizing: border-box; width: 100%; min-height: 58px; border: 2px solid #151515"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: #151515; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #151515">위치 자동 인증<span style="padding: 2px 6px; border-radius: 6px; background: #151515; color: #F25C05; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PRO</span></span><span style="font-size: 12px; color: #6B6B66">헬스장에 정한 시간만큼 머물면 자동 인증</span></span></button></sc-if><sc-if value="{{ gpsOff }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ pick_gps }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; box-sizing: border-box; width: 100%; min-height: 58px; border: 1px solid #DAD9D4"><span style="flex-shrink: 0; box-sizing: border-box; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9C8C3; background: #FFFFFF"></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #151515">위치 자동 인증<span style="padding: 2px 6px; border-radius: 6px; background: #151515; color: #F25C05; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PRO</span></span><span style="font-size: 12px; color: #6B6B66">헬스장에 정한 시간만큼 머물면 자동 인증</span></span></button></sc-if>
</div>
<sc-if value="{{ gpsOn }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600; color: #5E5E59">헬스장 위치</div>
<div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 14px; border: 1px solid #DAD9D4; background: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span style="font-size: 15px; color: #6B6B66">헬스장 이름이나 주소</span></div>
<div style="position: relative; height: 90px; border-radius: 16px; background: #DAD9D4; overflow: hidden; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; width: 72px; height: 72px; border-radius: 36px; background: rgba(242, 92, 5, 0.18); border: 2px solid #F25C05"></div>
<div style="width: 14px; height: 14px; border-radius: 7px; background: #151515; border: 3px solid #FFFFFF"></div>
<div style="position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #5E5E59">[지도]</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600; color: #5E5E59">머무를 시간</div>
<button type="button" aria-label="머무를 시간 바꾸기" onClick="{{ openDur }}" style="display: flex; align-items: center; justify-content: center; height: 72px; padding: 0 20px; border-radius: 16px; border: none; background: #151515; font-family: 'DotGothic16', monospace; font-size: 40px; line-height: 1; color: #F25C05; cursor: pointer">{{ durLabel }}</button>
<div style="font-size: 13px; line-height: 1.5; color: #5E5E59">주황 원 안에 {{ durText }} 이상 머물면 인증돼요. 위치는 인증 시간에만 확인해요.</div>
</div>
</sc-if>
<div style="flex-grow: 1"></div>
<a href="Stake.dc.html" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #151515; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">다음</a>
<sc-if value="{{ durOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(21, 21, 21, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
<div style="display: flex; flex-direction: column; gap: 18px; padding: 24px 24px 32px; border-radius: 28px 28px 0 0; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 18px; font-weight: 700">머무를 시간</div><button type="button" onClick="{{ closeDur }}" aria-label="닫기" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 22px; color: #5E5E59; cursor: pointer">×</button></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px"><div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><div style="font-size: 12px; color: #6B6B66">시간</div><div style="display: flex; align-items: center; gap: 12px"><button type="button" aria-label="시간 줄이기" onClick="{{ hDown }}" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #EFEEEA; font-size: 22px; color: #151515; cursor: pointer">−</button><div style="font-family: 'DotGothic16', monospace; font-size: 44px; line-height: 1; width: 56px; text-align: center">{{ tH }}</div><button type="button" aria-label="시간 늘리기" onClick="{{ hUp }}" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #EFEEEA; font-size: 22px; color: #151515; cursor: pointer">+</button></div></div><div style="font-family: 'DotGothic16', monospace; font-size: 36px; color: #6B6B66; padding-top: 22px">:</div><div style="display: flex; flex-direction: column; align-items: center; gap: 10px"><div style="font-size: 12px; color: #6B6B66">분</div><div style="display: flex; align-items: center; gap: 12px"><button type="button" aria-label="분 줄이기" onClick="{{ mDown }}" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #EFEEEA; font-size: 22px; color: #151515; cursor: pointer">−</button><div style="font-family: 'DotGothic16', monospace; font-size: 44px; line-height: 1; width: 56px; text-align: center">{{ tM }}</div><button type="button" aria-label="분 늘리기" onClick="{{ mUp }}" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #EFEEEA; font-size: 22px; color: #151515; cursor: pointer">+</button></div></div></div>
<button type="button" onClick="{{ applyDur }}" style="height: 56px; border-radius: 14px; border: none; background: #151515; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">확인</button>
</div>
</div>
</sc-if>
<sc-if value="{{ permOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(21, 21, 21, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
<div style="display: flex; flex-direction: column; gap: 18px; padding: 24px 24px 32px; border-radius: 28px 28px 0 0; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 18px; font-weight: 700">위치 권한이 필요해요</div><button type="button" onClick="{{ denyPerm }}" aria-label="닫기" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 22px; color: #5E5E59; cursor: pointer">×</button></div>
<div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: #151515">
<div style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 14px; background: #2A2A28; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F25C05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 15px; font-weight: 700; color: #FFFFFF">위치: 항상 허용</div><div style="font-size: 13px; color: #B8B8B2">앱을 닫아둬도 머문 시간을 재요</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #3F3F3C"><span style="flex-shrink: 0; width: 6px; height: 6px; margin-top: 8px; border-radius: 3px; background: #F25C05"></span><span>헬스장에 머문 시간을 재려면, 앱이 꺼져 있어도 위치를 확인해야 해요.</span></div>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #3F3F3C"><span style="flex-shrink: 0; width: 6px; height: 6px; margin-top: 8px; border-radius: 3px; background: #F25C05"></span><span>위치는 인증 시간에만 확인하고, 다른 용도로 쓰지 않아요.</span></div>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #3F3F3C"><span style="flex-shrink: 0; width: 6px; height: 6px; margin-top: 8px; border-radius: 3px; background: #F25C05"></span><span>허용하지 않으면 사진으로 인증할 수 있어요.</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{ grantPerm }}" style="height: 56px; border-radius: 14px; border: none; background: #151515; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">위치 권한 허용하기</button>
<button type="button" onClick="{{ denyPerm }}" style="height: 44px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #5E5E59; cursor: pointer">사진 인증으로 할게요</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: 'gps', granted: true, perm: false, d: 30, durOpen: false, tmp: [0, 30] }; }
  bump(i, dir) {
    const t = this.state.tmp.slice();
    if (i === 0) t[0] = (t[0] + dir + 4) % 4;
    else { const st = [0, 10, 20, 30, 40, 50]; let k = st.indexOf(t[1]); if (k < 0) k = 0; t[1] = st[(k + dir + st.length) % st.length]; }
    this.setState({ tmp: t });
  }
  renderVals() {
    const s = this.state, h = Math.floor(s.d / 60), m = s.d % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return {
      gpsOn: s.m === 'gps', gpsOff: s.m !== 'gps', photoOn: s.m === 'photo', photoOff: s.m !== 'photo',
      pick_gps: () => s.granted ? this.setState({ m: 'gps' }) : this.setState({ perm: true }),
      pick_photo: () => this.setState({ m: 'photo' }),
      permOpen: s.perm,
      grantPerm: () => this.setState({ granted: true, perm: false, m: 'gps' }),
      denyPerm: () => this.setState({ perm: false, m: 'photo' }),
      durLabel: pad(h) + ':' + pad(m),
      durText: ((h ? h + '시간 ' : '') + (m ? m + '분' : '')).trim(),
      openDur: () => this.setState({ durOpen: true, tmp: [h, m] }),
      closeDur: () => this.setState({ durOpen: false }),
      durOpen: s.durOpen,
      tH: pad(s.tmp[0]), tM: pad(s.tmp[1]),
      hUp: () => this.bump(0, 1), hDown: () => this.bump(0, -1), mUp: () => this.bump(1, 1), mDown: () => this.bump(1, -1),
      applyDur: () => { const d = Math.max(10, s.tmp[0] * 60 + s.tmp[1]); this.setState({ d, durOpen: false }); }
    };
  }
}
</script>
</body>
</html>
