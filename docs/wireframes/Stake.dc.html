<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>약정 금액 정하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E8E4}
a{color:#151515}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 12px; background: #E9E8E4; color: #151515; font-family: 'IBM Plex Sans KR', sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Goal.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5E5E59">2 / 3</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">약속을 어기면<br>얼마를 낼까요?</h1>
<p style="margin: 0; font-size: 15px; color: #6B6B66">어길 때마다 다음 금액으로 올라가요.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 20px; border-radius: 18px; background: #FFFFFF">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 84px; align-items: center; gap: 12px">
<div style="font-size: 13px; color: #5E5E59">{{ r.label }}</div>
<div style="height: 10px; border-radius: 5px; background: #DAD9D4"><div style="width: {{ r.w }}; height: 10px; border-radius: 5px; background: {{ r.color }}"></div></div>
<div style="font-size: 16px; font-weight: 600; text-align: right">{{ r.amount }}</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600; color: #5E5E59">한 번에 낼 최대 금액</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 10px; border-radius: 16px; border: 1px solid #DAD9D4; background: #FFFFFF">
<button type="button" aria-label="최대 금액 낮추기" onClick="{{ down }}" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: #EFEEEA; font-size: 22px; color: {{ downColor }}; cursor: pointer">−</button>
<div style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em">{{ maxLabel }}</div>
<button type="button" aria-label="최대 금액 높이기" onClick="{{ up }}" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: #EFEEEA; font-size: 22px; color: {{ upColor }}; cursor: pointer">+</button>
</div>
</div>
<div style="display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5E59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
<div style="font-size: 14px; line-height: 1.5; color: #5E5E59">금액은 언제든 바로 바꿀 수 있어요.</div>
</div>
<div style="flex-grow: 1"></div>
<a href="Consent.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #151515; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">다음</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.opts = [10000, 20000, 30000, 50000, 100000]; this.state = { k: 2 }; }
  won(n) { return n.toLocaleString('ko-KR') + '원'; }
  renderVals() {
    const k = this.state.k, max = this.opts[k];
    const steps = [0, Math.min(5000, max), Math.min(10000, max), max];
    const labels = ['1번째', '2번째', '3번째', '4번째~'];
    return {
      rows: steps.map((v, i) => ({
        label: labels[i],
        amount: i === 0 ? '연습 0원' : this.won(v),
        w: Math.round(v / max * 100) + '%',
        color: i === 3 ? '#F25C05' : '#151515'
      })),
      maxLabel: this.won(max),
      down: () => this.setState({ k: Math.max(0, k - 1) }),
      up: () => this.setState({ k: Math.min(this.opts.length - 1, k + 1) }),
      downColor: k === 0 ? '#B8B8B2' : '#151515',
      upColor: k === this.opts.length - 1 ? '#B8B8B2' : '#151515'
    };
  }
}
</script>
</body>
</html>
