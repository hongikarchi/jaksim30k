<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>약속 확인과 카드 등록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E8E4}
a{color:#151515}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 16px; background: #E9E8E4; color: #151515; font-family: 'IBM Plex Sans KR', sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Stake.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5E5E59">3 / 3</div>
</div>
<h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">이 약속으로<br>시작할게요</h1>
<div style="display: flex; flex-direction: column; border-top: 1px solid #D2D1CC">
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #D2D1CC; font-size: 15px"><span style="color: #6B6B66">약속</span><span style="font-weight: 600">미라클모닝</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #D2D1CC; font-size: 15px"><span style="color: #6B6B66">인증 시간</span><span style="font-weight: 600">평일 06:00–06:10</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #D2D1CC; font-size: 15px"><span style="color: #6B6B66">처음 어기면</span><span style="font-weight: 600">0원</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #D2D1CC; font-size: 15px"><span style="color: #6B6B66">그다음부터</span><span style="font-weight: 600">5,000원 → 30,000원</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #D2D1CC; font-size: 15px"><span style="color: #6B6B66">결제되는 때</span><span style="font-weight: 600">어긴 날로부터 24시간 뒤</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 16px; background: #FFFFFF">
<button type="button" onClick="{{ all.toggle }}" style="display: flex; gap: 12px; align-items: flex-start; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; line-height: 1.45; color: #151515; text-align: left; cursor: pointer"><sc-if value="{{ all.on }}" hint-placeholder-val="{{ true }}"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: #151515; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span></sc-if><sc-if value="{{ all.off }}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; box-sizing: border-box; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9C8C3; background: #FFFFFF"></span></sc-if><span>{{ all.text }}</span></button>
<div style="height: 1px; background: #EAE9E5"></div>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="3"><button type="button" onClick="{{ it.toggle }}" style="display: flex; gap: 12px; align-items: flex-start; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 14px; line-height: 1.45; color: #151515; text-align: left; cursor: pointer"><sc-if value="{{ it.on }}" hint-placeholder-val="{{ true }}"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: #151515; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span></sc-if><sc-if value="{{ it.off }}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; box-sizing: border-box; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9C8C3; background: #FFFFFF"></span></sc-if><span>{{ it.text }}</span></button></sc-for>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; line-height: 1.5; color: #5E5E59; text-align: center">지금은 결제되지 않아요. 카드만 등록해요.</div>
<a href="{{ ctaHref }}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: {{ ctaBg }}; color: {{ ctaFg }}; font-size: 17px; font-weight: 600; text-decoration: none">카드 등록하고 시작하기</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.texts = ["약속을 어기면 등록한 카드로 자동 결제되는 것을 이해했어요", "결제 전 24시간 안에 이의를 제기할 수 있어요", "이용약관과 자동결제에 동의해요"]; this.state = { checks: this.texts.map(() => false) }; }
  renderVals() {
    const c = this.state.checks, all = c.every(Boolean);
    return {
      all: { text: '모두 동의해요', on: all, off: !all, toggle: () => this.setState({ checks: c.map(() => !all) }) },
      items: this.texts.map((text, i) => ({ text, on: c[i], off: !c[i], toggle: () => { const n = c.slice(); n[i] = !n[i]; this.setState({ checks: n }); } })),
      ctaHref: all ? 'Home.dc.html' : '#',
      ctaBg: all ? '#151515' : '#C9C8C3',
      ctaFg: all ? '#FFFFFF' : '#6B6B66'
    };
  }
}
</script>
</body>
</html>
