<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>방청소 기준 정하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E8E4}
a{color:#151515}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 16px; background: #E9E8E4; color: #151515; font-family: 'IBM Plex Sans KR', sans-serif">
<div style="display: flex; align-items: center">
<a href="Goal.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">어떤 상태면<br>청소한 걸로 할까요?</h1>
<p style="margin: 0; font-size: 15px; color: #6B6B66">사진으로 확인할 수 있는 것만 골라요.</p>
</div>
<div role="group" aria-label="청소 기준" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
<sc-if value="{{ it.on }}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="true" onClick="{{ it.toggle }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; box-sizing: border-box; border: 2px solid #151515"><span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: #151515; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span><span style="font-size: 15px; font-weight: 600; color: #151515">{{ it.text }}</span></button></sc-if>
<sc-if value="{{ it.off }}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="false" onClick="{{ it.toggle }}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; box-sizing: border-box; border: 1px solid #DAD9D4"><span style="flex-shrink: 0; box-sizing: border-box; width: 22px; height: 22px; border-radius: 11px; border: 2px solid #C9C8C3; background: #FFFFFF"></span><span style="font-size: 15px; font-weight: 600; color: #151515">{{ it.text }}</span></button></sc-if>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600; color: #5E5E59">기준 사진</div>
<a href="RoomRefCamera.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: #151515; text-decoration: none">
<div style="width: 76px; height: 76px; border-radius: 12px; background: #3A3A38; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></div>
<div style="font-size: 14px; line-height: 1.5; color: #D6D6D1">지금 방을 한 번 찍어두세요. 매번 이 각도로 겹쳐서 찍게 돼요.</div>
</a>
</div>
<div style="flex-grow: 1"></div>
<a href="RoomRefCamera.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #151515; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">기준 사진 찍기</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.texts = ["바닥에 물건이 없다", "침대가 정리되어 있다", "책상 위 물건이 3개 이하다", "설거지통이 비어 있다", "빨래가 개어져 있다"]; this.state = { on: [true, true, true, false, false] }; }
  renderVals() {
    const on = this.state.on;
    return { items: this.texts.map((text, i) => ({ text, on: on[i], off: !on[i], toggle: () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); } })) };
  }
}
</script>
</body>
</html>
