<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>약속 고르기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E8E4}
a{color:#151515}a:hover{color:#000000}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 16px; background: #E9E8E4; color: #151515; font-family: 'IBM Plex Sans KR', sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; margin-left: -10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5E5E59">1 / 3</div>
</div>
<h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.03em">어떤 약속을 할까요?</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
<sc-if value="{{ c.selected }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{ c.pick }}" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 18px; border-radius: 14px; border: 2px solid #151515; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column"><span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600; color: #151515">{{ c.name }}<sc-if value="{{ c.pro }}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 6px; border-radius: 6px; background: #151515; color: #F25C05; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PRO</span></sc-if></span><span style="font-size: 12px; color: #6B6B66">{{ c.desc }}</span></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #F25C05"></span></button>
</sc-if>
<sc-if value="{{ c.unselected }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{ c.pick }}" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid #DAD9D4; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer"><span style="display: flex; flex-direction: column"><span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600; color: #151515">{{ c.name }}<sc-if value="{{ c.pro }}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 6px; border-radius: 6px; background: #151515; color: #F25C05; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em">PRO</span></sc-if></span><span style="font-size: 12px; color: #6B6B66">{{ c.desc }}</span></span></button>
</sc-if>
</sc-for>
</div>
<sc-if value="{{ showTime }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600; color: #5E5E59">인증 시간</div>
<sc-if value="{{ same }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: center; gap: 20px; height: 72px; padding: 0 20px; border-radius: 16px; background: #151515">
<button type="button" aria-label="시작 시간 바꾸기" onClick="{{ openStart }}" style="display: flex; align-items: center; height: 72px; padding: 0; border: none; background: transparent; font-family: 'DotGothic16', monospace; font-size: 40px; line-height: 1; color: #F25C05; cursor: pointer">{{ start }}</button>
<div style="display: flex; align-items: center; height: 72px; font-family: 'DotGothic16', monospace; font-size: 40px; line-height: 1; color: #F25C05">~</div>
<button type="button" aria-label="끝 시간 바꾸기" onClick="{{ openEnd }}" style="display: flex; align-items: center; height: 72px; padding: 0; border: none; background: transparent; font-family: 'DotGothic16', monospace; font-size: 40px; line-height: 1; color: #F25C05; cursor: pointer">{{ end }}</button>
</div>
</sc-if>
<sc-if value="{{ custom }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ openDays }}" style="display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 20px; border-radius: 16px; border: none; background: #151515; font-family: inherit; cursor: pointer"><span style="font-size: 18px; font-weight: 700; color: #F25C05">요일마다 달라요</span><span style="font-size: 13px; font-weight: 600; color: #B8B8B2">수정</span></button>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 600; color: #5E5E59">요일</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<sc-if value="{{ d.on }}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="true" onClick="{{ d.toggle }}" style="height: 44px; border-radius: 12px; border: none; background: #151515; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{ d.label }}</button></sc-if>
<sc-if value="{{ d.off }}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="false" onClick="{{ d.toggle }}" style="height: 44px; border-radius: 12px; border: none; background: #FFFFFF; color: #5E5E59; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{ d.label }}</button></sc-if>
</sc-for>
</div>
<button type="button" onClick="{{ openDays }}" style="align-self: flex-end; display: flex; align-items: center; gap: 2px; height: 32px; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: #5E5E59; cursor: pointer">요일마다 다르게 설정<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E5E59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</sc-if>
<div style="flex-grow: 1"></div>
<a href="{{ nextHref }}" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #151515; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">다음</a>
<sc-if value="{{ daysOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(21, 21, 21, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 32px; border-radius: 28px 28px 0 0; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 18px; font-weight: 700">요일마다 다르게</div><button type="button" onClick="{{ closeDays }}" aria-label="닫기" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 22px; color: #5E5E59; cursor: pointer">×</button></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{ dayRows }}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 12px 0 16px; border-radius: 14px; background: #151515">
<span style="font-size: 15px; font-weight: 700; color: #FFFFFF">{{ r.label }}</span>
<span style="display: flex; align-items: center; gap: 4px"><button type="button" onClick="{{ r.openS }}" style="height: 40px; padding: 0 6px; border: none; background: transparent; font-family: 'DotGothic16', monospace; font-size: 24px; line-height: 1; color: #F25C05; cursor: pointer">{{ r.start }}</button><span style="font-family: 'DotGothic16', monospace; font-size: 20px; color: #F25C05">~</span><button type="button" onClick="{{ r.openE }}" style="height: 40px; padding: 0 6px; border: none; background: transparent; font-family: 'DotGothic16', monospace; font-size: 24px; line-height: 1; color: #F25C05; cursor: pointer">{{ r.end }}</button></span>
</div>
</sc-for>
</div>
<button type="button" onClick="{{ closeDays }}" style="height: 56px; border-radius: 14px; border: none; background: #151515; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">완료</button>
</div>
</div>
</sc-if>
<sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(21, 21, 21, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
<div style="display: flex; flex-direction: column; gap: 22px; padding: 24px 24px 32px; border-radius: 28px 28px 0 0; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 18px; font-weight: 700">{{ sheetTitle }}</div><button type="button" onClick="{{ closeSheet }}" aria-label="닫기" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 22px; color: #5E5E59; cursor: pointer">×</button></div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-size: 12px; color: #6B6B66">시</div>
<div style="display: flex; align-items: center; gap: 12px"><button type="button" aria-label="시 줄이기" onClick="{{ hDown }}" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #EFEEEA; font-size: 22px; color: #151515; cursor: pointer">−</button><div style="font-family: 'DotGothic16', monospace; font-size: 44px; line-height: 1; width: 56px; text-align: center">{{ tH }}</div><button type="button" aria-label="시 늘리기" onClick="{{ hUp }}" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #EFEEEA; font-size: 22px; color: #151515; cursor: pointer">+</button></div>
</div>
<div style="font-family: 'DotGothic16', monospace; font-size: 36px; color: #6B6B66; padding-top: 22px">:</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<div style="font-size: 12px; color: #6B6B66">분</div>
<div style="display: flex; align-items: center; gap: 12px"><button type="button" aria-label="분 줄이기" onClick="{{ mDown }}" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #EFEEEA; font-size: 22px; color: #151515; cursor: pointer">−</button><div style="font-family: 'DotGothic16', monospace; font-size: 44px; line-height: 1; width: 56px; text-align: center">{{ tM }}</div><button type="button" aria-label="분 늘리기" onClick="{{ mUp }}" style="width: 48px; height: 48px; border-radius: 14px; border: none; background: #EFEEEA; font-size: 22px; color: #151515; cursor: pointer">+</button></div>
</div>
</div>
<button type="button" onClick="{{ applySheet }}" style="height: 56px; border-radius: 14px; border: none; background: #151515; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">확인</button>
</div>
</div>
</sc-if>
<sc-if value="{{ lockOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(21, 21, 21, 0.45); display: flex; flex-direction: column; justify-content: flex-end">
<div style="display: flex; flex-direction: column; gap: 18px; padding: 24px 24px 32px; border-radius: 28px 28px 0 0; background: #FFFFFF">
<div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 18px; font-weight: 700">프로 기능이에요</div><button type="button" onClick="{{ closeLock }}" aria-label="닫기" style="width: 44px; height: 44px; border: none; background: transparent; font-size: 22px; color: #5E5E59; cursor: pointer">×</button></div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 18px 20px; border-radius: 20px; background: #151515">
<div style="display: flex; flex-direction: column; gap: 6px"><div style="font-family: 'DotGothic16', monospace; font-size: 32px; line-height: 1; color: #F25C05">PRO</div><div style="font-size: 15px; font-weight: 700; color: #FFFFFF">{{ lockTitle }}</div></div>
<div style="flex-shrink: 0; padding: 6px 10px; border-radius: 8px; background: #F25C05; color: #151515; font-size: 12px; font-weight: 700">7일 무료</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
<div style="display: flex; gap: 10px; align-items: center; font-size: 15px; color: #151515"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 6L9 17l-5-5"></path></svg><span>러닝 자동 인증</span></div>
<div style="display: flex; gap: 10px; align-items: center; font-size: 15px; color: #151515"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 6L9 17l-5-5"></path></svg><span>헬스장 위치 자동 인증</span></div>
<div style="display: flex; gap: 10px; align-items: center; font-size: 15px; color: #151515"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 6L9 17l-5-5"></path></svg><span>감시자 지정</span></div>
<div style="display: flex; gap: 10px; align-items: center; font-size: 15px; color: #151515"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 6L9 17l-5-5"></path></svg><span>쉬어가기 한 달 4번</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; line-height: 1.5; color: #5E5E59; text-align: center">월 4,900원, 체험 중 언제든 해지할 수 있어요</div>
<a href="Pro.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 14px; background: #151515; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">7일 무료로 시작하기</a>
<button type="button" onClick="{{ closeLock }}" style="height: 44px; border: none; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #5E5E59; cursor: pointer">다음에 할게요</button>
</div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.presets = {
      morning: { start: [6, 0], end: [6, 10], days: [1,1,1,1,1,0,0] },
      run: { start: [19, 0], end: [22, 0], days: [1,0,1,0,1,0,0] },
      gym: { start: [19, 0], end: [23, 0], days: [1,0,1,0,1,0,0] },
      book: { start: [0, 0], end: [23, 59], days: [1,1,1,1,1,1,1] },
      room: { start: [21, 0], end: [23, 59], days: [1,1,1,1,1,1,1] }
    };
    this.state = Object.assign({ cat: 'morning', sheet: null, tmp: [6, 0], daysOpen: false, isPro: false, lock: false }, this.fromPreset('morning'));
  }
  fromPreset(id) {
    const p = this.presets[id];
    return { days: p.days.map(Boolean), times: [0,1,2,3,4,5,6].map(() => ({ start: p.start.slice(), end: p.end.slice() })) };
  }
  fmt(t) { return String(t[0]).padStart(2, '0') + ':' + String(t[1]).padStart(2, '0'); }
  first() { const i = this.state.days.indexOf(true); return i < 0 ? 0 : i; }
  isCustom() {
    const s = this.state, on = [0,1,2,3,4,5,6].filter((i) => s.days[i]);
    if (on.length < 2) return false;
    const k = (i) => this.fmt(s.times[i].start) + this.fmt(s.times[i].end);
    return on.some((i) => k(i) !== k(on[0]));
  }
  open(d, w) { const src = d === null ? this.first() : d; this.setState({ sheet: { d, w }, tmp: this.state.times[src][w].slice() }); }
  bump(i, dir) {
    const t = this.state.tmp.slice();
    if (i === 0) { t[0] = (t[0] + dir + 24) % 24; }
    else {
      const steps = [0, 10, 20, 30, 40, 50, 59];
      let k = steps.indexOf(t[1]); if (k < 0) k = 0;
      t[1] = steps[(k + dir + steps.length) % steps.length];
    }
    this.setState({ tmp: t });
  }
  apply() {
    const s = this.state, sh = s.sheet;
    const times = s.times.map((x, i) => (sh.d === null || sh.d === i) ? Object.assign({}, x, { [sh.w]: s.tmp.slice() }) : x);
    this.setState({ times, sheet: null });
  }
  renderVals() {
    const s = this.state, f = this.first(), custom = this.isCustom();
    const labels = ['월','화','수','목','금','토','일'];
    const list = [
      ['morning', '미라클모닝', '시간 안에 촬영 + 랜덤 미션'],
      ['run', '러닝', '스트라바 기록 연동'],
      ['gym', '헬스장', '헬스장 안 촬영 + 랜덤 미션'],
      ['book', '책읽기', '페이지 촬영 + 한 줄 기록'],
      ['room', '방청소', '체크리스트 + 같은 각도 촬영']
    ];
    const next = { run: 'RunConnect.dc.html', room: 'RoomSetup.dc.html', gym: 'GymMethod.dc.html' }[s.cat] || 'Stake.dc.html';
    return {
      cats: list.map(([id, name, desc]) => ({ name, desc, pro: id === 'run', selected: s.cat === id, unselected: s.cat !== id, pick: () => (id === 'run' && !s.isPro) ? this.setState({ lock: true }) : this.setState(Object.assign({ cat: id, sheet: null, daysOpen: false }, this.fromPreset(id))) })),
      lockOpen: s.lock, closeLock: () => this.setState({ lock: false }), lockTitle: '러닝 자동 인증은 프로에서 쓸 수 있어요',
      days: labels.map((label, i) => ({ label, on: s.days[i], off: !s.days[i], toggle: () => { const d = s.days.slice(); d[i] = !d[i]; this.setState({ days: d }); } })),
      start: this.fmt(s.times[f].start), end: this.fmt(s.times[f].end),
      same: !custom, custom,
      showTime: true,
      nextHref: next,
      openStart: () => this.open(null, 'start'), openEnd: () => this.open(null, 'end'),
      openDays: () => this.setState({ daysOpen: true }), closeDays: () => this.setState({ daysOpen: false }),
      daysOpen: s.daysOpen,
      dayRows: labels.map((label, i) => ({ i, label })).filter((r) => s.days[r.i]).map((r) => ({
        label: r.label + '요일', start: this.fmt(s.times[r.i].start), end: this.fmt(s.times[r.i].end),
        openS: () => this.open(r.i, 'start'), openE: () => this.open(r.i, 'end')
      })),
      sheetOpen: !!s.sheet,
      sheetTitle: (s.sheet && s.sheet.d !== null ? labels[s.sheet.d] + '요일 ' : '') + (s.sheet && s.sheet.w === 'end' ? '끝 시간' : '시작 시간'),
      tH: String(s.tmp[0]).padStart(2, '0'), tM: String(s.tmp[1]).padStart(2, '0'),
      hUp: () => this.bump(0, 1), hDown: () => this.bump(0, -1), mUp: () => this.bump(1, 1), mDown: () => this.bump(1, -1),
      closeSheet: () => this.setState({ sheet: null }),
      applySheet: () => this.apply()
    };
  }
}
</script>
</body>
</html>
